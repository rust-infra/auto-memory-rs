  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    &quot;codex-visualization-widget-state&quot;,

  initialStateElement?.remove();

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

    const nextState = typeof next === &quot;function&quot; ? next(state) : next;

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||

          typeof value === &quot;function&quot; ||

      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);

    }

    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());

      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {

      openExternal,
      sendFollowUpMessage,

      visualizationStyleVariables: {},

      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(

        detail: { globals: globalThis.openai },
      }),

  };

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */

              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);

                pendingStateWrites.delete(id);

        return;
      }
      hostPort = nextHostPort;

  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {

    }

    if (event.target instanceof globalThis.Element) {

      return;
    }
    if (href.startsWith(&quot;#&quot;)) {

        id = decodeURIComponent(href.slice(1));

&lt;style&gt;
  #search-pipeline-viz { --gap: 14px; font-size: var(--font-size-base, 14px); color: var(--foreground); }

  #search-pipeline-viz .sp-tick.is-now { background: var(--primary); }

  #search-pipeline-viz .sp-query { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border: 1px solid var(--border); border-radius: var(--radius-md, 8px); padding: 10px 12px; background: color-mix(in oklab, var(--foreground) 4%, var(--card)); }
  #search-pipeline-viz .sp-cmd { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #search-pipeline-viz .sp-fromto { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #search-pipeline-viz .sp-arrow { color: var(--muted-foreground); }
  #search-pipeline-viz .sp-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .875em; padding: 2px 7px; border-radius: var(--radius-sm, 6px); background: var(--muted); overflow-wrap: anywhere; }
  #search-pipeline-viz .sp-vec { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8em; color: var(--muted-foreground); overflow-wrap: anywhere; }

  #search-pipeline-viz .sp-lanes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  #search-pipeline-viz .sp-lane { border: 1px solid var(--border); border-top: 3px solid var(--sp-lane); border-radius: var(--radius-md, 8px); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  #search-pipeline-viz .sp-lane[data-lane=&quot;fts&quot;] { --sp-lane: var(--viz-series-1, var(--primary)); }
  #search-pipeline-viz .sp-lane[data-lane=&quot;vec&quot;] { --sp-lane: var(--viz-series-3, var(--blue)); }
  #search-pipeline-viz .sp-lane-title { font-weight: 500; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  #search-pipeline-viz .sp-lane-sub { color: var(--muted-foreground); }
  #search-pipeline-viz .sp-hit { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 5px 8px; border-radius: var(--radius-sm, 6px); }
  #search-pipeline-viz .sp-hit[data-owner=&quot;simple&quot;] { background: color-mix(in oklab, var(--primary) 14%, transparent); }
  #search-pipeline-viz .sp-hit-name { overflow-wrap: anywhere; }
  #search-pipeline-viz .sp-hit-score { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85em; }
  #search-pipeline-viz .sp-track { grid-column: 1 / -1; height: 5px; border-radius: var(--radius-full, 999px); background: var(--muted); overflow: hidden; }
  #search-pipeline-viz .sp-fill { display: block; height: 100%; width: 0; background: var(--sp-lane); transition: width .7s ease; }
  #search-pipeline-viz .is-on .sp-fill { width: var(--sp-w, 0%); }

  #search-pipeline-viz .sp-panel { border: 1px solid var(--border); border-radius: var(--radius-md, 8px); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  #search-pipeline-viz .sp-panel-title { color: var(--muted-foreground); }
  #search-pipeline-viz .sp-chunks { display: flex; flex-direction: column; gap: 6px; }
  #search-pipeline-viz .sp-chunk { display: grid; grid-template-columns: minmax(120px, 1fr) auto; gap: 2px 10px; align-items: center; }
  #search-pipeline-viz .sp-chunk-key { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85em; }

(function () {

  if (!root) return;

  var STEPS = [
    { label: &#x27;查询&#x27;, detail: &#x27;&lt;strong&gt;输入 &lt;code&gt;note&lt;/code&gt;&lt;/strong&gt;——项目 oracle 的索引里有 47 条搜索行、78 个向量块。&#x27; },
    { label: &#x27;两种形态&#x27;, detail: &#x27;&lt;strong&gt;同一个词走两条路&lt;/strong&gt;：关键词通道把它变成前缀表达式 &lt;code&gt;note*&lt;/code&gt;；语义通道用 ONNX Runtime 1.29.0 + bge-small 把它编码成 384 维查询向量。&#x27; },
    { label: &#x27;两路召回&#x27;, detail: &#x27;&lt;strong&gt;两条通道各查各的&lt;/strong&gt;：FTS 命中 15 条，simple 排第 3；向量通道拿查询向量和 78 个块比余弦，simple 排第 4。两条通道里都出现了 simple。&#x27; },
    { label: &#x27;为什么是 simple&#x27;, detail: &#x27;&lt;strong&gt;entity 行的分数来自它自己的两个块&lt;/strong&gt;：&lt;code&gt;entity:9:1&lt;/code&gt;（那行 &lt;code&gt;- [note] …&lt;/code&gt;）相似度 0.681014 胜出——查询词就写在这一块里。&#x27; },
    { label: &#x27;融合&#x27;, detail: &#x27;&lt;strong&gt;两条通道合成一个分数&lt;/strong&gt;：bm25 先按本页最大绝对值归一化，再取 &lt;code&gt;max + 0.3 × min&lt;/code&gt;。simple 两条通道都命中，于是拿到加成。&#x27; },
    { label: &#x27;排序&#x27;, detail: &#x27;&lt;strong&gt;融合后重排&lt;/strong&gt;：simple 从关键词通道第 3 / 语义通道第 4 升到总榜第 3——两条通道都命中让它超过了只有单条通道命中的 中文测试文档 与 Wikilinks Demo。&#x27; },
    { label: &#x27;落到笔记&#x27;, detail: &#x27;&lt;strong&gt;结果带回可点击的落点&lt;/strong&gt;：permalink、file_path，以及命中的正文片段——短笔记直接返回整段。注意默认只搜 entity 行：那条更相似的 observation 行（0.725384）要显式指定 &lt;code&gt;--entity-type observation&lt;/code&gt; 才会出现。&#x27; }
  ];

  var label = document.getElementById(&#x27;sp-step-label&#x27;);
  var detail = document.getElementById(&#x27;sp-detail&#x27;);
  var ticks = root.querySelectorAll(&#x27;.sp-tick&#x27;);
  var playBtn = document.getElementById(&#x27;sp-play&#x27;);
  var prevBtn = document.getElementById(&#x27;sp-prev&#x27;);
  var nextBtn = document.getElementById(&#x27;sp-next&#x27;);

  var params = new URLSearchParams(window.location.search);
  var requested = parseInt(params.get(&#x27;step&#x27;) || &#x27;&#x27;, 10);
  var still = params.has(&#x27;static&#x27;);
  var reduce = window.matchMedia &amp;&amp; window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
  var total = STEPS.length;
  var step = 1;
  var timer = null;
  var playing = !reduce &amp;&amp; !still;
  var DWELL = 3800;
  if (still) root.classList.add(&#x27;is-static&#x27;);

  function apply() {
    root.setAttribute(&#x27;data-step&#x27;, String(step));
    label.textContent = step + &#x27; / &#x27; + total + &#x27; · &#x27; + STEPS[step - 1].label;
    detail.innerHTML = STEPS[step - 1].detail;

    for (var i = 0; i &lt; ticks.length; i++) {
      ticks[i].className = &#x27;sp-tick&#x27; + (i + 1 &lt; step ? &#x27; is-done&#x27; : i + 1 === step ? &#x27; is-now&#x27; : &#x27;&#x27;);
    }
    var bits = root.querySelectorAll(&#x27;[data-reveal]&#x27;);
    for (var b = 0; b &lt; bits.length; b++) {
      bits[b].classList.toggle(&#x27;is-on&#x27;, step &gt;= Number(bits[b].getAttribute(&#x27;data-reveal&#x27;)));
    }
    prevBtn.disabled = step === 1;
    nextBtn.disabled = step === total;
    playBtn.textContent = playing ? &#x27;暂停&#x27; : &#x27;播放&#x27;;
    playBtn.setAttribute(&#x27;aria-pressed&#x27;, playing ? &#x27;true&#x27; : &#x27;false&#x27;);
  }

  function go(next) {
    step = Math.min(total, Math.max(1, next));
    apply();
    if (step === total) stop();
  }

  function tick() {
    if (step &gt;= total) { step = 1; apply(); } else { go(step + 1); }
  }

  function start() {
    if (timer || reduce) return;
    playing = true;
    timer = window.setInterval(tick, DWELL);
    apply();
  }

  function stop() {
    playing = false;
    if (timer) { window.clearInterval(timer); timer = null; }
    apply();
  }

  prevBtn.addEventListener(&#x27;click&#x27;, function () { stop(); go(step - 1); });
