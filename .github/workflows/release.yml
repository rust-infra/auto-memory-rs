name: Release

# Tag `vX.Y.Z` and this builds the binaries `scripts/install.sh` downloads.
#
# The workflow that runs is the one in the tagged commit, so the tag has to point at a
# commit that already contains this file.
#
# ONNX Runtime is deliberately *not* bundled: the crate uses `ort`'s `load-dynamic`
# feature, so the binary resolves `libonnxruntime` at run time (from `ORT_DYLIB_PATH`,
# the fastembed/uv install, or the platform loader). That is what keeps these artifacts
# portable — semantic search is simply unavailable where no runtime is found, while text
# search, context, schema, and the MCP server keep working.
#
# The musl targets are statically linked, so they carry no glibc floor at all: the gnu
# artifacts need the host's glibc to be at least as new as the runner's (Ubuntu 24.04 =
# 2.39), which rules out older distributions and musl-based ones. The price is semantic
# search — ONNX Runtime is published only as a glibc-linked shared library and a static
# musl binary cannot `dlopen` it (measured: `failed to load from …: dlopen failed`), so
# `--vector` and `--hybrid` are unavailable on those two artifacts, while text search,
# context, schema and the MCP server work everywhere. The container image
# (`.github/workflows/container.yml`) is where ONNX Runtime *is* bundled.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            musl: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            archive: tar.gz
            musl: true
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install the musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        env:
          # `rusqlite`'s bundled SQLite is C, so the C compiler has to match the target;
          # `cc` picks `musl-gcc` for a musl target, and the linker has to be told
          # explicitly or rustc falls back to the host's `cc` and links against glibc.
          # Both variables are set on every job for simplicity — cargo only reads the
          # one matching the target it is building.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          set -euo pipefail
          name="auto-memory-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/auto-memory" "dist/$name/"
          cp LICENSE README.md "dist/$name/"
          tar -czf "$name.tar.gz" -C dist "$name"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "auto-memory-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/auto-memory.exe" "dist/$name/"
          Copy-Item LICENSE, README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          if-no-files-found: error
          path: |
            auto-memory-${{ matrix.target }}.tar.gz
            auto-memory-${{ matrix.target }}.zip

  publish:
    name: release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          # One `sha256sum` call over every archive so the file covers all of them.
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
